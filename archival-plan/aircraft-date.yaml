databaseID: "airline-rds"
query:
  table: "flights"
  batchingEnabled: true
  batchColumn: "scheduled_departure"
  batchColumnType: "datetime" # int or datetime
  batchStep: 5
  batchColumnMin: 2017-01-01T00:00:00
  batchColumnMax: 2017-02-04T04:59:59
  filterConditions: 
    - "departure_airport = 'DME'"
archiveStorage:
  enabled: true
  type: "s3"
  s3:
    bucket: "nar21-lab"
    region: "ap-south-1"
  local:
    path: "/tmp/db-archive"
cleanup:
  enabled: false