databaseID: "airline"
query:
  table: "flights"
  batchingEnabled: false
  batchColumn: "flight_id"
  batchColumnType: "int"
  batchStep: 10
  batchColumnMin: 10
  batchColumnMax: 90
  filterConditions:
    - "departure_airport = 'DME'"
  runtimeParameters:
    dryRun: false
archive:
  type: "s3"
  s3:
    bucket: "nar21-lab"
    region: "ap-south-1"

workers: 4    # Number of parallel workers