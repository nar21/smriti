databaseID: "airline-rds"
query:
  table: "flights"
  batchingEnabled: true
  batchColumn: "flight_id"
  batchColumnType: "int"
  batchStep: 100000
  batchColumnMin: 0
  batchColumnMax: 2000000
  filterConditions: 
    - "departure_airport = 'DME'"
archiveStorage:
  enabled: false
  type: "s3"
  s3:
    bucket: "nar21-lab"
    region: "ap-south-1"
  local:
    path: "/tmp/db-archive"
cleanup:
  enabled: false