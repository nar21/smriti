databaseID: "airline"
query:
  table: "flights"
  batchingEnabled: true
  batchColumn: "flight_id"
  batchColumnType: "int"
  batchStep: 10
  batchColumnMin: 10
  batchColumnMax: 90
  filterConditions:
    - "departure_airport = 'DME'"
  runtimeParameters:
    dryRun: true

workers: 4    # Number of parallel workers