databaseID: "airline-rds"
query:
  table: "flights"
  batchingEnabled: false
  batchColumn: "flight_id"
  batchColumnType: "int"
  batchStep: 10
  batchColumnMin: 10
  batchColumnMax: 90
  filterConditions:
    - "departure_airport = 'DME'"
archiveStorage:
  type: "s3"
  bucket:
    bucketName: "nar21-lab"
    region: "ap-south-1"
cleanup:
  enabled: true

workers: 4    # Number of parallel workers